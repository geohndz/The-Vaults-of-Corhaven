<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fate Cards — draft prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #34405c;
    --bg-bot: #121829;
    --ink: #f3ead6;
    --muted: rgba(243, 234, 214, .72);
    --gold: #d4af5f;
    --gold-deep: #9c7a32;
    --btn-ink: #1d1505;
    --chip: rgba(8, 12, 22, .38);
    --line: rgba(212, 175, 95, .38);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1b2338;
      --bg-bot: #05070d;
      --ink: #efe5cf;
      --muted: rgba(239, 229, 207, .66);
      --chip: rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1b2338;
    --bg-bot: #05070d;
    --ink: #efe5cf;
    --muted: rgba(239, 229, 207, .66);
    --chip: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse 90% 80% at 50% 42%, var(--bg-top), var(--bg-bot) 78%);
    background-color: var(--bg-bot);
    color: var(--ink);
    font-family: "EB Garamond", Georgia, "Times New Roman", serif;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; display: block; touch-action: manipulation; }

  .bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px;
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .brand {
    font-family: Cinzel, "Times New Roman", serif; font-weight: 700;
    font-size: 19px; letter-spacing: .04em; color: var(--gold);
    margin-right: auto; white-space: nowrap;
  }
  .brand small {
    font-family: "EB Garamond", Georgia, serif; font-weight: 400; font-style: italic;
    font-size: 15px; letter-spacing: 0; color: var(--muted); margin-left: 8px;
  }
  .chip {
    font-size: 16px; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap;
  }
  .btn {
    font-family: Cinzel, "Times New Roman", serif; font-weight: 700; font-size: 15px; letter-spacing: .05em;
    color: var(--btn-ink);
    background: linear-gradient(180deg, #ecd08a, var(--gold) 55%, var(--gold-deep));
    border: 1px solid #f6e3ad; border-radius: 10px;
    padding: 10px 18px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45);
    transition: transform .15s ease, filter .15s ease, opacity .25s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.07); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: saturate(.4); }
  .btn.ghost {
    color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); box-shadow: none;
  }
  .btn.ghost:hover:not(:disabled) { filter: none; border-color: var(--gold); }

  #action {
    position: absolute; z-index: 4; left: 50%; top: 80%;
    transform: translateX(-50%);
    opacity: 0; pointer-events: none; min-width: 150px;
  }
  #action.show { opacity: 1; pointer-events: auto; }

  #prompt {
    position: absolute; z-index: 2; left: 50%; bottom: 22px;
    transform: translateX(-50%);
    width: min(92%, 560px); text-align: center;
    font-size: 19px; line-height: 1.35; font-style: italic; color: var(--muted);
    transition: opacity .3s ease; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 5;
    font-family: Cinzel, serif; color: var(--gold); font-size: 18px; letter-spacing: .06em;
    transition: opacity .4s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }

  @media (max-width: 560px) {
    .bar { padding: 10px 12px; gap: 8px; }
    .brand { font-size: 16px; width: 100%; }
    .brand small { display: none; }
    .chip { font-size: 14px; padding: 3px 10px; }
    .btn { font-size: 13px; padding: 9px 14px; }
    #use { margin-left: auto; }
    #prompt { font-size: 16px; bottom: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, #prompt, #loading { transition: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <header class="bar">
    <div class="brand">Fate Cards <small>draft prototype</small></div>
    <span id="roundChip" class="chip">Round 0</span>
    <span id="handChip" class="chip">Hand 0 / 2</span>
    <button id="use" class="btn ghost" type="button">Use a card</button>
    <button id="end" class="btn" type="button">End round</button>
  </header>
  <div id="prompt"></div>
  <button id="action" class="btn" type="button">Done</button>
  <div id="loading">Shuffling the deck…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function () {
  // ---------------------------------------------------------------- data
  const CARDS = [
    { id: 1,  cat: "Blessing", title: "The King’s Favor",   duration: "Until you use that die, or your next turn ends.", desc: "Add 1 to your next die, as long as the higher number still makes a legal move. Bonus moves are not affected." },
    { id: 2,  cat: "Blessing", title: "Phantom March",      duration: "Through your next turn.", desc: "Your troops can move through enemy phalanxes, but can’t land on them." },
    { id: 3,  cat: "Blessing", title: "The Unbroken",       duration: "Until it protects a troop, or your next turn ends.", desc: "The next time one of your troops would be captured, it stays on its square instead." },
    { id: 4,  cat: "Blessing", title: "Wayfarer’s Grace",   duration: "Through your next turn.", desc: "Your troops can move through your own phalanxes, but can’t land on them." },
    { id: 5,  cat: "Blessing", title: "True Sight",         duration: "Through the next Mist.", desc: "You can see every enemy troop while the Mist covers the board." },
    { id: 6,  cat: "Tactical", title: "The Hunter’s Mark",  duration: "Until your next capture.", desc: "Your next capture gives a bonus move of 30 squares instead of 20." },
    { id: 7,  cat: "Tactical", title: "Second Chance",      duration: "Until you use it.", desc: "Reroll both dice once, before you move a troop." },
    { id: 8,  cat: "Tactical", title: "Royal Decree",       duration: "Takes effect right away.", desc: "Bring one troop out of your keep without rolling a 1 or a 6. Your gate needs room for it." },
    { id: 9,  cat: "Tactical", title: "The Pilgrim",        duration: "Until one of your troops uses it.", desc: "The next time one of your troops moves into or along its passage, it moves 2 extra squares." },
    { id: 10, cat: "Curse",    title: "The King’s Burden",  duration: "Until your next bonus move, or your next turn ends.", desc: "Your next bonus move is 10 squares instead of 20." },
    { id: 11, cat: "Curse",    title: "Broken Formation",   duration: "Through your next turn.", desc: "You can’t form new phalanxes. Phalanxes already on the board stay." },
    { id: 12, cat: "Curse",    title: "The Wanderer",       duration: "Takes effect right away.", desc: "The troop that landed on the shrine moves to a random empty square on its road." },
    { id: 13, cat: "Curse",    title: "Sealed Gates",       duration: "Through your next turn.", desc: "You can’t bring troops out of your keep." }
  ];
  const CAT = {
    Blessing: { label: "BLESSING", light: "#e6bd5e", color: "#b8892b", dark: "#6b4c10" },
    Tactical: { label: "TACTICAL", light: "#5ea6c6", color: "#2f6f8f", dark: "#163b4f" },
    Curse:    { label: "CURSE",    light: "#c65463", color: "#8f2b3a", dark: "#4b121b" }
  };
  const ROMAN = ["", "I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII"];
  const HAND_MAX = 2;

  // ---------------------------------------------------------------- dom
  const stage = document.getElementById("stage");
  const ui = {
    end: document.getElementById("end"),
    use: document.getElementById("use"),
    round: document.getElementById("roundChip"),
    hand: document.getElementById("handChip"),
    prompt: document.getElementById("prompt"),
    action: document.getElementById("action"),
    loading: document.getElementById("loading")
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('700 50px Cinzel'),
        document.fonts.load('500 26px Cinzel'),
        document.fonts.load('400 30px "EB Garamond"'),
        document.fonts.load('italic 500 28px "EB Garamond"')
      ]),
      sleep(3000)
    ]);
  } catch (e) { /* fall back to system serif */ }

  // ---------------------------------------------------------------- three
  const CAM_Z = 10, W = 1.6, H = 2.4, PEEK = 0.62;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);
  const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 0, CAM_Z);

  // ---------------------------------------------------------------- canvas art
  const DISPLAY = 'Cinzel, "Times New Roman", serif';
  const BODY = '"EB Garamond", Georgia, "Times New Roman", serif';
  const PW = 640, PH = 960, PR = 44;

  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  const spaced = s => s.split("").join("\u200A");
  function wrap(g, text, maxW) {
    const words = text.split(" "), lines = []; let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line); return lines;
  }
  function star(g, cx, cy, ro, ri, n, rot) {
    g.beginPath();
    for (let i = 0; i < n * 2; i++) { const r = i % 2 ? ri : ro, a = rot + i * Math.PI / n; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    g.closePath(); g.fill();
  }
  function line(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  function makeCanvas() { const c = document.createElement("canvas"); c.width = 768; c.height = 1152; const g = c.getContext("2d"); g.scale(1.2, 1.2); return [c, g]; }
  function toTex(c) { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = MAX_ANISO; return t; }

  function emblem(g, catName, cat, cx, cy) {
    const R = 84;
    const gr = g.createRadialGradient(cx, cy - 24, 8, cx, cy, R);
    gr.addColorStop(0, cat.light); gr.addColorStop(1, cat.dark);
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fillStyle = gr; g.fill();
    g.lineWidth = 4; g.strokeStyle = cat.color; g.stroke();
    g.beginPath(); g.arc(cx, cy, R - 10, 0, Math.PI * 2); g.lineWidth = 1.5; g.strokeStyle = "rgba(251,243,226,.55)"; g.stroke();
    g.fillStyle = "#fbf3e2"; g.strokeStyle = "#fbf3e2";
    if (catName === "Blessing") {
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2, len = i % 2 ? 54 : 68;
        g.beginPath();
        g.moveTo(cx + Math.cos(a - .13) * 30, cy + Math.sin(a - .13) * 30);
        g.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
        g.lineTo(cx + Math.cos(a + .13) * 30, cy + Math.sin(a + .13) * 30);
        g.closePath(); g.fill();
      }
      g.beginPath(); g.arc(cx, cy, 24, 0, Math.PI * 2); g.fill();
    } else if (catName === "Tactical") {
      g.lineWidth = 2;
      g.beginPath(); g.arc(cx, cy, 58, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(cx, cy, 38, 0, Math.PI * 2); g.stroke();
      star(g, cx, cy, 68, 11, 4, -Math.PI / 2);
      g.globalAlpha = .7; star(g, cx, cy, 42, 8, 4, -Math.PI / 4); g.globalAlpha = 1;
      g.fillStyle = cat.dark; g.beginPath(); g.arc(cx, cy, 6, 0, Math.PI * 2); g.fill();
    } else {
      const o = document.createElement("canvas"); o.width = o.height = 200; const q = o.getContext("2d");
      q.fillStyle = "#fbf3e2"; q.beginPath(); q.arc(100, 100, 54, 0, Math.PI * 2); q.fill();
      q.globalCompositeOperation = "destination-out"; q.beginPath(); q.arc(126, 84, 47, 0, Math.PI * 2); q.fill();
      g.drawImage(o, cx - 100, cy - 100);
      star(g, cx + 30, cy - 22, 10, 3, 4, 0);
      star(g, cx + 44, cy + 14, 7, 2, 4, 0);
      star(g, cx + 16, cy + 30, 5, 1.6, 4, 0);
    }
  }

  function drawFront(d) {
    const [c, g] = makeCanvas(); const cat = CAT[d.cat]; const rnd = mulberry(d.id * 977);
    rr(g, 0, 0, PW, PH, PR); g.save(); g.clip();
    let gr = g.createLinearGradient(0, 0, PW, PH); gr.addColorStop(0, "#f7eedb"); gr.addColorStop(1, "#e2cea3");
    g.fillStyle = gr; g.fillRect(0, 0, PW, PH);
    for (let i = 0; i < 1100; i++) { g.fillStyle = `rgba(110,75,30,${rnd() * 0.09})`; g.fillRect(rnd() * PW, rnd() * PH, 1 + rnd() * 2, 1 + rnd() * 2); }
    gr = g.createRadialGradient(PW / 2, PH * .45, PH * .2, PW / 2, PH / 2, PH * .72);
    gr.addColorStop(0, "rgba(120,80,30,0)"); gr.addColorStop(1, "rgba(105,66,22,0.34)");
    g.fillStyle = gr; g.fillRect(0, 0, PW, PH);
    g.restore();

    // frame
    g.lineWidth = 16; g.strokeStyle = cat.color; rr(g, 8, 8, PW - 16, PH - 16, PR - 8); g.stroke();
    g.lineWidth = 2; g.strokeStyle = cat.dark; rr(g, 26, 26, PW - 52, PH - 52, 26); g.stroke();

    // category band
    g.save(); rr(g, 26, 26, PW - 52, PH - 52, 26); g.clip();
    gr = g.createLinearGradient(0, 26, 0, 104); gr.addColorStop(0, cat.color); gr.addColorStop(1, cat.dark);
    g.fillStyle = gr; g.fillRect(26, 26, PW - 52, 78); g.restore();
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#fbf3e2"; g.font = `500 25px ${DISPLAY}`;
    g.fillText(spaced("✦   " + cat.label + "   ✦"), PW / 2, 66);

    // title
    g.textBaseline = "alphabetic"; g.fillStyle = "#2a1c0e";
    let fs = 56; do { g.font = `700 ${fs}px ${DISPLAY}`; fs -= 2; } while (g.measureText(d.title).width > 540 && fs > 28);
    g.fillText(d.title, PW / 2, 178);

    // divider
    g.strokeStyle = cat.color; g.lineWidth = 2;
    line(g, 110, 206, 296, 206); line(g, 344, 206, 530, 206);
    g.fillStyle = cat.color; g.beginPath(); g.moveTo(320, 196); g.lineTo(330, 206); g.lineTo(320, 216); g.lineTo(310, 206); g.closePath(); g.fill();

    emblem(g, d.cat, cat, PW / 2, 320);

    // duration panel
    g.font = `italic 500 27px ${BODY}`;
    const dl = wrap(g, d.duration, 470);
    const bt = 432, bh = 58 + dl.length * 32;
    g.fillStyle = hexA(cat.color, .12); rr(g, 60, bt, 520, bh, 14); g.fill();
    g.strokeStyle = hexA(cat.color, .7); g.lineWidth = 2; g.stroke();
    g.fillStyle = cat.dark; g.font = `700 17px ${DISPLAY}`; g.fillText(spaced("DURATION"), PW / 2, bt + 32);
    g.fillStyle = "#3a2a16"; g.font = `italic 500 27px ${BODY}`;
    dl.forEach((l, i) => g.fillText(l, PW / 2, bt + 66 + i * 32));

    // description
    const top = bt + bh + 40, bottom = 878;
    let size = 31, lines, lh;
    do { g.font = `400 ${size}px ${BODY}`; lines = wrap(g, d.desc, 500); lh = size * 1.32; size--; } while (lines.length * lh > bottom - top && size > 19);
    const off = Math.max(0, ((bottom - top) - lines.length * lh) * 0.35);
    g.textBaseline = "top"; g.fillStyle = "#2b1f12";
    lines.forEach((l, i) => g.fillText(l, PW / 2, top + off + i * lh));

    // footer numeral
    g.textBaseline = "middle"; g.fillStyle = cat.dark; g.font = `500 18px ${DISPLAY}`;
    g.fillText(ROMAN[d.id], PW / 2, 908);
    g.strokeStyle = hexA(cat.color, .6); g.lineWidth = 1.5;
    line(g, 220, 908, 285, 908); line(g, 355, 908, 420, 908);
    return toTex(c);
  }

  function drawBack() {
    const [c, g] = makeCanvas();
    rr(g, 0, 0, PW, PH, PR); g.save(); g.clip();
    let gr = g.createLinearGradient(0, 0, PW, PH); gr.addColorStop(0, "#22305a"); gr.addColorStop(1, "#0b1126");
    g.fillStyle = gr; g.fillRect(0, 0, PW, PH);
    g.strokeStyle = "rgba(212,175,95,0.15)"; g.lineWidth = 1.5;
    for (let k = -PH; k < PW + PH; k += 46) { line(g, k, 0, k + PH, PH); line(g, k, 0, k - PH, PH); }
    gr = g.createRadialGradient(PW / 2, PH / 2, 20, PW / 2, PH / 2, PH * .55);
    gr.addColorStop(0, "rgba(212,175,95,0.22)"); gr.addColorStop(1, "rgba(212,175,95,0)");
    g.fillStyle = gr; g.fillRect(0, 0, PW, PH);
    g.restore();
    g.strokeStyle = "#c9a24f"; g.lineWidth = 14; rr(g, 7, 7, PW - 14, PH - 14, PR - 7); g.stroke();
    g.lineWidth = 2; rr(g, 28, 28, PW - 56, PH - 56, 24); g.stroke();
    g.globalAlpha = .5; rr(g, 40, 40, PW - 80, PH - 80, 18); g.stroke(); g.globalAlpha = 1;
    g.fillStyle = "#d4af5f";
    [[64, 64], [PW - 64, 64], [64, PH - 64], [PW - 64, PH - 64]].forEach(([x, y]) => star(g, x, y, 12, 4, 4, 0));

    const cx = PW / 2, cy = PH / 2 - 20;
    g.beginPath(); g.arc(cx, cy, 132, 0, Math.PI * 2); g.lineWidth = 3; g.strokeStyle = "#d4af5f"; g.stroke();
    gr = g.createRadialGradient(cx, cy, 10, cx, cy, 114); gr.addColorStop(0, "#2c3d6e"); gr.addColorStop(1, "#0e1631");
    g.beginPath(); g.arc(cx, cy, 114, 0, Math.PI * 2); g.fillStyle = gr; g.fill(); g.lineWidth = 1.5; g.stroke();
    gr = g.createLinearGradient(cx, cy - 96, cx, cy + 96); gr.addColorStop(0, "#f2d892"); gr.addColorStop(1, "#a77f2f");
    g.fillStyle = gr; star(g, cx, cy, 96, 34, 8, -Math.PI / 2);
    g.fillStyle = "#101a38"; star(g, cx, cy, 52, 22, 8, -Math.PI / 2 + Math.PI / 8);
    g.fillStyle = "#d4af5f"; g.beginPath(); g.arc(cx, cy, 13, 0, Math.PI * 2); g.fill();
    g.textAlign = "center"; g.textBaseline = "middle"; g.font = `700 44px ${DISPLAY}`;
    g.fillText(spaced("FATE"), cx, cy + 196);
    return toTex(c);
  }

  function drawGlow() {
    const c = document.createElement("canvas"); c.width = 420; c.height = 580; const g = c.getContext("2d");
    g.shadowColor = "#fff"; g.shadowBlur = 34; g.fillStyle = "#fff";
    rr(g, 50, 50, 320, 480, 26); g.fill(); g.fill();
    g.shadowBlur = 0; g.globalCompositeOperation = "destination-out"; rr(g, 53, 53, 314, 474, 24); g.fill();
    const t = new THREE.CanvasTexture(c); return t;
  }
  function drawDot() {
    const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  }

  const FRONT = {}; CARDS.forEach(d => FRONT[d.id] = drawFront(d));
  const BACK = drawBack(), GLOW = drawGlow();

  // ---------------------------------------------------------------- shared geometry
  function roundedShape(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
  }
  const planeGeo = new THREE.PlaneGeometry(W, H);
  const glowGeo = new THREE.PlaneGeometry(2.1, 2.9);
  const edgeGeo = new THREE.ExtrudeGeometry(roundedShape(W - 0.014, H - 0.014, 0.12), { depth: 0.007, bevelEnabled: false, curveSegments: 6 });

    live.forEach(k => { k.hoverT = k === c ? 1 : 0; if (!k.pulse) k.glowT = k === c ? 1 : 0; });
    if (c && !c.pulse) c.glowMat.color.set(state === "replacing" ? RED : GOLD);
    renderer.domElement.style.cursor = c ? "pointer" : "default";
  });
  renderer.domElement.addEventListener("pointerleave", () => { if (state !== "busy") clearHover(); });
  renderer.domElement.addEventListener("click", e => {
    const c = pickAt(e);
    if (!c) { if (state === "pickUse") cancelUse(); return; }
    if (state === "pickUse") { chooseUse(c); return; }
    if (state === "choosing") { offers.includes(c) ? pickOffer(c) : viewHand(c); }
    else if (state === "idle") viewHand(c);
    else if (state === "replacing") chooseDiscard(c);
  });
  ui.end.addEventListener("click", startRound);
  ui.use.addEventListener("click", startUse);
  window.addEventListener("keydown", e => {
    if (e.code === "Space" && state === "idle" && document.activeElement !== ui.end && document.activeElement !== ui.use) { e.preventDefault(); startRound(); }
    if (e.code === "KeyU" && state === "idle") startUse();
  });

  // ---------------------------------------------------------------- resize
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  function relayout() {
    hand.forEach((c, i) => { if (c.inSlot) tweenCard(c, slotTarget(i), 220); });
    if (state === "choosing") offers.forEach((c, i) => tweenCard(c, offerTarget(i), 220));
    if (state === "reading") {
      offers.forEach((c, i) => { if (c !== picked) tweenCard(c, offerTarget(i), 220); });
      const z = zoomTarget(); tweenCard(picked, z, 220); dimTo(z.pos[2]);
    }
    if (state === "viewing") { const z = zoomTarget(); tweenCard(viewing, z, 220); dimTo(z.pos[2]); }
    if (state === "pickUse") { const L = useLayout(); hand.forEach((c, i) => tweenCard(c, L.items[i], 220)); dimTo(L.z, 0.5); }
    if (state === "replacing") {
      const L = replaceLayout(); [hand[0], hand[1], picked].forEach((c, i) => tweenCard(c, L.items[i], 220)); dimTo(L.z, 0.5);
    }
  }
  resize();
  new ResizeObserver(() => { resize(); relayout(); }).observe(stage);

  // ---------------------------------------------------------------- loop
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    updateTweens(now);
    for (const c of live) {
      c.hover += (c.hoverT - c.hover) * 0.18;
      const bob = (!reduceMotion && state === "choosing" && offers.includes(c)) ? Math.sin(t * 1.6 + c.phase) * 0.03 : 0;
      c.inner.position.y = c.hover * (c.inSlot ? 0.32 : 0.14) + bob;
      c.inner.scale.setScalar(1 + c.hover * (c.inSlot ? 0.02 : 0.045));
      const gt = c.pulse ? 0.6 + 0.35 * Math.sin(t * 3.2) : c.glowT;
      c.glowCur += (gt - c.glowCur) * 0.15;
      c.glowMat.opacity = c.glowCur * c.opacity * 0.9;
      c.mats.forEach(m => m.opacity = c.opacity);
    }
    const dm = dimmer.material;
    dm.opacity += (dimTarget - dm.opacity) * 0.12; dimmer.visible = dm.opacity > 0.005;
    if (!reduceMotion) {
      const a = dustGeo.attributes.position;
      for (let i = 0; i < DUST; i++) {
        a.array[i * 3 + 1] += dustSpd[i] * dt;
        a.array[i * 3] += Math.sin(t * 0.4 + i) * 0.002;
        if (a.array[i * 3 + 1] > 5.5) a.array[i * 3 + 1] = -5.5;
      }
      a.needsUpdate = true;
    }
    updateSparks(dt);
    updateAction();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  ui.loading.classList.add("gone");
  setState("idle");
})();
</script>
</body>
</html>
