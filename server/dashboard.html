<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The March — records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="/The%20Vaults%20of%20Corhaven_files/css2" rel="stylesheet">
<style>
:root{
  --leather:#2C333C;--gold:#9AABBC;--gold-bright:#E6EDF4;
  --parch:#E8EEF4;--parch-dim:#A9B6C4;--iron:#14181E;
  --ember:#7F2F27;--thorn:#3B3A29;--sol:#944A08;--tide:#494B54;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--leather);color:var(--parch);
  font-family:'Alegreya','Iowan Old Style',Palatino,Georgia,serif;font-size:17px;line-height:1.45}
body{padding:calc(env(safe-area-inset-top,0px) + 36px) 28px calc(env(safe-area-inset-bottom,0px) + 48px);position:relative}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}
.wrap{width:min(1080px,100%);margin:0 auto}
h1{font-family:'Pirata One','UnifrakturCook',Georgia,serif;font-weight:400;font-size:clamp(42px,8vw,68px);line-height:.95;margin:0 0 8px;color:var(--gold-bright)}
.lead{margin:0 0 40px;color:var(--parch-dim);max-width:42ch}
form.out{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:calc(env(safe-area-inset-right,0px) + 22px);margin:0}
.ghost{background:transparent;border:0;padding:0;color:var(--parch-dim);letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--gold-bright)}
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.gate form{width:min(420px,100%)}
.gate label{display:block;font-weight:600;margin:0 0 8px}
.field{width:100%;padding:12px 14px;font-size:20px;background:rgba(0,0,0,.28);color:var(--parch);border:1.5px solid var(--gold);border-radius:0}
.enter{margin-top:20px;width:100%;padding:14px;font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(#D7E0E8,#8B9AAB);color:var(--iron);border:2px solid #5A6672;cursor:pointer}
.err{color:#FFB8A8;min-height:1.4em;margin:12px 0 0;font-size:15px}
.err:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 24px;margin:0 0 48px}
.stat dt{margin:0;color:var(--parch-dim);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.stat dd{margin:4px 0 0;font-size:clamp(28px,4vw,42px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--gold-bright)}
.stat small{display:block;margin-top:4px;font-size:14px;font-weight:400;color:var(--parch-dim);letter-spacing:0;text-transform:none}
h2{margin:0 0 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright);font-weight:700}
.block{margin:0 0 44px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(148px,220px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:15px}
.bar b{font-weight:600}
.bar i{display:block;height:7px;background:rgba(154,171,188,.22)}
.bar i span{display:block;height:100%;background:var(--gold-bright);transform-origin:left center}
.bar em{font-style:normal;color:var(--parch-dim);font-variant-numeric:tabular-nums;text-align:right}
.king{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.king article{min-width:0}
.king b{display:block;font-size:16px}
.king span{display:block;margin-top:4px;color:var(--parch-dim);font-size:15px}
.k0 b{color:var(--ember)} .k1 b{color:#7dce7a} .k2 b{color:var(--sol)} .k3 b{color:#7aa4e6}
.list{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:minmax(120px,1.2fr) .7fr .45fr .5fr minmax(0,1.5fr) .8fr .7fr .7fr .7fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(230,237,244,.12);font-size:15px;font-variant-numeric:tabular-nums}
.row:first-child{color:var(--parch-dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-bottom:8px;border-bottom-color:rgba(230,237,244,.28)}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.test{opacity:.55}
.testbtn{margin:0;padding:4px 0;border:0;background:none;color:var(--gold-bright);letter-spacing:.08em;text-transform:uppercase;font-size:12px;cursor:pointer}
.testbtn:hover{color:var(--parch)}
.empty{color:var(--parch-dim);margin:8px 0 0}
[hidden]{display:none !important}
@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .king{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr 1fr;gap:6px 16px}
  .row span:nth-child(n+3){grid-column:auto}
  .head{display:none}
}
@media (max-width:560px){
  body{padding:calc(env(safe-area-inset-top,0px) + 24px) 18px 40px}
  .grid{grid-template-columns:1fr 1fr;gap:22px 16px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="gate" id="gate" hidden>
    <h1>The March</h1>
    <p class="lead">The records of the realm. The word that opens them is not spoken on the road.</p>
    <form method="post" action="/dashboard">
      <label for="password">Word of entry</label>
      <input class="field" id="password" name="password" type="password" autocomplete="current-password" autofocus>
      <button class="enter" type="submit">Enter</button>
      <p class="err" id="gateErr">{{ERROR}}</p>
    </form>
  </section>

  <section id="dash" hidden>
    <form class="out" method="post" action="/dashboard"><button class="ghost" name="logout" value="1" type="submit">Leave the records</button></form>
    <h1>The March</h1>
    <p class="lead">Every match that has been recorded. Averages are taken from the matches that have ended.</p>

    <dl class="grid" id="stats"></dl>

    <div class="block">
      <h2>How they play</h2>
      <div class="bars" id="modes"></div>
    </div>
    <div class="block">
      <h2>World events</h2>
      <div class="bars" id="worlds"></div>
    </div>
    <div class="block">
      <h2>Device</h2>
      <div class="bars" id="devices"></div>
    </div>
    <div class="block">
      <h2>How they end</h2>
      <div class="bars" id="outcomes"></div>
    </div>
    <div class="block">
      <h2>Kingdoms</h2>
      <div class="king" id="kingdoms"></div>
    </div>
    <div class="block">
      <h2>Recent matches</h2>
      <div class="list" id="recent"></div>
    </div>
  </section>
</div>
<script>
const AUTHED={{AUTHED}};
const $=id=>document.getElementById(id);
const pct=n=>Math.round((n||0)*100)+'%';
const dur=ms=>{
  if(!ms)return '—';
  const s=Math.round(ms/1000);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h)return h+'h '+m+'m';
  if(m)return m+'m '+String(sec).padStart(2,'0')+'s';
  return sec+'s';
};
const when=t=>{
  const d=new Date(t);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
};
const n1=n=>!n&&n!==0?'—':(Math.round(n*10)/10).toString().replace(/\.0$/,'');
function bar(label,count,total){
  const p=total?count/total:0;
  return `<div class="bar"><b>${label}</b><i><span style="width:${Math.round(p*100)}%"></span></i><em>${count}</em></div>`;
}
function paint(data){
  const s=data.stats||{},t=s.total||0,ended=s.ended||0;
  const localVs=t?`${pct(s.localShare)} local`:'—';
  const cells=[
    ['Matches',s.total||0,s.last7Days?s.last7Days+' in the last seven days':''],
    ['Finished',ended?pct(s.completionRate):'—','Reached the vault'],
    ['Average duration',dur(s.avgDurationMs),'Among matches that ended'],
    ['Local vs online',localVs,t?pct(s.onlineShare)+' online':''],
    ['Turns',n1(s.avgTurns),'Average player turns per game'],
    ['Rounds',n1(s.avgRounds),'Average rounds per game'],
    ['Doubles',s.rollCount?pct(s.doublesRate):'—','Of play rolls'],
    ['Greed',s.greedTotal||0,'Third doubles recorded']
  ];
  $('stats').innerHTML=cells.map(([k,v,sub])=>`<div class="stat"><dt>${k}</dt><dd>${v}${sub?`<small>${sub}</small>`:''}</dd></div>`).join('');
  $('modes').innerHTML=bar('Local',(s.byMode||{}).local||0,t)+bar('Online',(s.byMode||{}).online||0,t);
  const wr=s.worldRank||{};
  const worldNames=[['flood','Drowning Tide'],['ash','Heartfire Rising'],['wild','Wild Awakening'],['sun','Searing Seal'],['mist','Veil of Mist'],['ways','Stones of the Pact']];
  const worldRows=worldNames.map(([id,name])=>({name,n:wr[id]||0})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  const worldTotal=worldRows.reduce((n,r)=>n+r.n,0);
  $('worlds').innerHTML=worldRows.map(r=>bar(r.name,r.n,worldTotal)).join('');
  const d=s.byDevice||{};
  const forms={phone:'Phone',tablet:'Tablet',desktop:'Desktop',xr:'XR'};
  $('devices').innerHTML=['phone','tablet','desktop','xr'].map(k=>bar(forms[k],d[k]||0,t)).join('');
  const o=s.byOutcome||{};
  $('outcomes').innerHTML=bar('Vault',o.vault||0,t)+bar('Forfeit',o.forfeit||0,t)+bar('Left early',o.abandoned||0,t)+bar('Still playing',o.playing||0,t);
  const ks=s.kingdoms||{};
  const names=['Emberhold','Thornwald','Solmere','Tidereach'];
  $('kingdoms').innerHTML=names.map((n,i)=>{
    const row=ks[n]||{appeared:0};
    return `<article class="k${i}"><b>${n}</b><span>Sat ${row.appeared}</span></article>`;
  }).join('');
  const rows=data.matches||[];
  if(!rows.length){$('recent').innerHTML='<p class="empty">The March has not yet been recorded.</p>';return;}
  const head=`<div class="row head"><span>When</span><span>Where</span><span>Seats</span><span>People</span><span>Kingdoms</span><span>Length</span><span>End</span><span>Device</span><span>Count</span></div>`;
  $('recent').innerHTML=head+rows.slice(0,40).map(m=>{
    const end=m.outcome==='vault'?'Vault':m.outcome==='forfeit'?'Forfeit':m.outcome==='abandoned'?'Left':'Playing';
    const form=m.device&&m.device.form?m.device.form[0].toUpperCase()+m.device.form.slice(1):'—';
    const id=String(m.id||'').replace(/"/g,'&quot;');
    const people=m.humans==null?'—':m.humans;
    return `<div class="row${m.test?' test':''}"><span>${when(m.startedAt)}</span><span>${m.mode==='online'?'Online':'Local'}</span><span>${m.players||'—'}</span><span>${people}</span><span>${(m.kingdoms||[]).join(', ')||'—'}</span><span>${dur(m.durationMs)}</span><span>${end}</span><span>${form}</span><span><button class="testbtn" type="button" data-id="${id}" data-test="${m.test?'1':'0'}">${m.test?'Test':'Count'}</button></span></div>`;
  }).join('');
  $('recent').onclick=e=>{
    const b=e.target.closest&&e.target.closest('.testbtn');
    if(!b)return;
    b.disabled=true;
    fetch('/api/metrics',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,test:b.dataset.test!=='1'})}).then(r=>{
      if(r.status===401){location.reload();return;}
      return r.json();
    }).then(d=>{if(d)paint(d);}).catch(()=>{b.disabled=false;});
  };
}
if(!AUTHED){$('gate').hidden=false;}
else{
  $('dash').hidden=false;
  fetch('/api/metrics',{credentials:'same-origin'}).then(r=>{
    if(r.status===401){location.reload();return;}
    return r.json();
  }).then(d=>{if(d)paint(d);}).catch(()=>{$('recent').innerHTML='<p class="empty">The records could not be reached.</p>';});
}
</script>
</body>
</html>
